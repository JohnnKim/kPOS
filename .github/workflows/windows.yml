name: Windows CI and release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and smoke-test Windows package
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      TEST_PROJECT: tests/kPOS.Tests/kPOS.Tests.csproj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          skip-lts-prepass: true
      - name: Restore locked dependencies
        run: dotnet restore "$env:TEST_PROJECT" --locked-mode
      - name: Build Release
        run: dotnet build "$env:TEST_PROJECT" --configuration Release --no-restore -warnaserror
      - name: Run automated tests
        run: dotnet test --project "$env:TEST_PROJECT" --configuration Release --no-build --minimum-expected-tests 1 --report-trx --results-directory "$env:RUNNER_TEMP/test-results"
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: ${{ runner.temp }}/test-results/*.trx
      - name: Package and test the extracted executable
        run: |
          $version = '0.0.0-ci'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./scripts/Publish-Windows.ps1 -Version $version -OutputDirectory "$env:RUNNER_TEMP/kpos-release"
      - name: Upload verified release assets
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: ${{ runner.temp }}/kpos-release/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Verify checksum and publish
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="kPOS-${version}-win-x64.zip"
          sha256sum --check "$asset.sha256"
          args=( "$RELEASE_TAG" "$asset" "$asset.sha256" --verify-tag --generate-notes --title "kPOS $version" )
          if [[ "$version" == *-* ]]; then
            args+=( --prerelease --latest=false )
          fi
          gh release create "${args[@]}"
