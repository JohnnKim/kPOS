<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kPOS Register</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Instrument Sans", "Segoe UI", sans-serif;
      background: #f4f3ed;
      color: #212820;
      --line: #d5d8cc;
      --green: #254c37;
      --muted: #536056;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    :focus-visible { outline: 3px solid #925410; outline-offset: 3px; }
    .header { background: var(--green); color: white; padding: 1.2rem max(1.2rem, calc((100vw - 70rem) / 2)); }
    .header p { margin: 0; color: #dce9dc; }
    h1 { margin: 0; font-size: 2.1rem; letter-spacing: -.05em; }
    h2 { margin: 0 0 1rem; font-size: 1.35rem; }
    main { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.25rem; align-items: start; }
    section { padding: 1.25rem; background: #fffdf8; border: 1px solid var(--line); border-radius: .9rem; }
    label { display: block; margin-bottom: .4rem; font-weight: 650; }
    input { width: 100%; padding: .75rem; color: inherit; border: 1px solid #858c81; border-radius: .4rem; background: white; }
    .catalog { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: .65rem; margin-top: 1rem; }
    .product { background: #f0f4e9; color: inherit; text-align: left; padding: .9rem; border: 1px solid var(--line); border-radius: .55rem; min-height: 6rem; }
    .product:hover { background: #e3edd9; }
    .product span { display: block; }
    .product .price { font-weight: 700; margin-top: .4rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    .cart-line, .total { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
    .cart-line { padding: .65rem 0; border-bottom: 1px solid var(--line); }
    .quantity { display: flex; gap: .35rem; align-items: center; flex-shrink: 0; }
    .quantity button { min-width: 2rem; min-height: 2rem; background: #f0f4e9; color: inherit; border: 1px solid var(--line); border-radius: .3rem; }
    .total { margin: 1rem 0; font-size: 1.25rem; font-weight: 700; }
    .checkout { margin-top: .75rem; width: 100%; padding: .75rem; border: 0; border-radius: .4rem; background: var(--green); color: white; font-weight: 700; }
    .receipt { border-top: 1px dashed #858c81; margin-top: 1rem; padding-top: .8rem; }
    .receipt p { margin: .3rem 0; }
    @media (max-width: 42rem) { main { grid-template-columns: 1fr; margin-top: 1rem; } }
  </style>
</head>
<body>
  <header class="header">
    <h1>kPOS</h1>
    <p>Demo register</p>
  </header>
  <main>
    <section aria-labelledby="products-title">
      <h2 id="products-title">Products</h2>
      <label for="lookup">Find by name or item code</label>
      <input id="lookup" type="search" placeholder="Try 101 or cider" autocomplete="off">
      <div class="catalog" id="catalog"></div>
      <p class="muted" id="lookup-status" role="status"></p>
    </section>
    <section aria-labelledby="sale-title">
      <h2 id="sale-title">Current sale</h2>
      <div id="cart"></div>
      <div class="total"><span>Total</span><output id="total">$0.00</output></div>
      <form id="payment">
        <label for="cash">Cash received</label>
        <input id="cash" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" required>
        <button class="checkout" id="checkout" disabled>Complete demo sale</button>
        <p id="payment-status" class="muted" role="status"></p>
      </form>
      <div id="receipt" class="receipt" aria-live="polite" hidden></div>
    </section>
  </main>
  <script>
    const products = [
      { code: "101", name: "Pale Ale", pack: "6 × 12 oz", cents: 1199 },
      { code: "102", name: "Dry Cider", pack: "4 × 16 oz", cents: 1099 },
      { code: "201", name: "Pinot Noir", pack: "750 mL", cents: 1799 },
      { code: "202", name: "Sauvignon Blanc", pack: "750 mL", cents: 1499 },
      { code: "301", name: "Straight Bourbon", pack: "750 mL", cents: 3299 },
      { code: "302", name: "London Dry Gin", pack: "750 mL", cents: 2599 },
    ];
    const cart = new Map();
    const currency = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
    const money = (cents) => currency.format(cents / 100);
    const byId = (id) => document.getElementById(id);
    const lookup = byId("lookup");
    const catalog = byId("catalog");
    const cartView = byId("cart");
    const cash = byId("cash");

    function element(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function totalCents() {
      return products.reduce((sum, product) => sum + product.cents * (cart.get(product.code) ?? 0), 0);
    }

    function parseCash(value) {
      const text = value.trim();
      if (!/^\d{1,7}(?:\.\d{1,2})?$/.test(text)) return null;
      const [dollars, fraction = ""] = text.split(".");
      return Number(dollars) * 100 + Number(fraction.padEnd(2, "0"));
    }

    function matches() {
      const query = lookup.value.trim().toLowerCase();
      return products.filter((product) => product.code.includes(query) || product.name.toLowerCase().includes(query));
    }

    function changeQuantity(product, delta) {
      const quantity = (cart.get(product.code) ?? 0) + delta;
      if (quantity > 0) cart.set(product.code, quantity);
      else cart.delete(product.code);
      byId("payment-status").textContent = "";
      renderCart();
    }

    function renderCatalog() {
      catalog.replaceChildren();
      for (const product of matches()) {
        const button = element("button", "", "product");
        button.append(element("strong", product.name));
        button.append(element("span", product.pack + " · " + product.code, "muted"));
        button.append(element("span", money(product.cents), "price"));
        button.addEventListener("click", () => changeQuantity(product, 1));
        catalog.append(button);
      }
      byId("lookup-status").textContent = catalog.childElementCount ? "" : "No products match.";
    }

    function renderCart() {
      cartView.replaceChildren();
      if (!cart.size) cartView.append(element("p", "The cart is empty.", "muted"));
      for (const product of products) {
        const quantity = cart.get(product.code);
        if (!quantity) continue;
        const row = element("div", "", "cart-line");
        const detail = element("div", "");
        detail.append(element("strong", product.name), element("div", money(product.cents * quantity), "muted"));
        const controls = element("div", "", "quantity");
        for (const [symbol, delta, action] of [["−", -1, "Remove one"], ["+", 1, "Add one"]]) {
          const button = element("button", symbol);
          button.setAttribute("aria-label", action + " " + product.name);
          button.addEventListener("click", () => {
            changeQuantity(product, delta);
            const replacement = [...cartView.querySelectorAll("button")].find((item) => item.getAttribute("aria-label") === action + " " + product.name);
            (replacement ?? lookup).focus();
          });
          controls.append(button);
          if (delta < 0) controls.append(element("span", String(quantity)));
        }
        row.append(detail, controls);
        cartView.append(row);
      }
      byId("total").textContent = money(totalCents());
      byId("checkout").disabled = cart.size === 0;
    }

    lookup.addEventListener("input", renderCatalog);
    lookup.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      const results = matches();
      const exact = results.find((product) => product.code === lookup.value.trim());
      const product = exact ?? (results.length === 1 ? results[0] : null);
      if (!product) return;
      changeQuantity(product, 1);
      lookup.value = "";
      renderCatalog();
      byId("lookup-status").textContent = product.name + " added to the cart.";
    });

    byId("payment").addEventListener("submit", (event) => {
      event.preventDefault();
      if (!cart.size) return;
      const received = parseCash(cash.value);
      const total = totalCents();
      if (received === null || received < total) {
        byId("payment-status").textContent = received === null
          ? "Enter a cash amount such as 20.00."
          : "Still due: " + money(total - received) + ".";
        cash.focus();
        return;
      }
      const receipt = byId("receipt");
      receipt.replaceChildren(
        element("strong", "Sale complete"),
        element("p", "Total " + money(total) + " · Cash " + money(received)),
        element("p", "Change " + money(received - total)),
      );
      receipt.hidden = false;
      cart.clear();
      cash.value = "";
      byId("payment-status").textContent = "";
      renderCart();
      lookup.focus();
    });

    renderCatalog();
    renderCart();
  </script>
</body>
</html>
